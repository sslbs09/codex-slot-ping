name: Windows portable build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v0.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test solution
        run: dotnet test CodexSlotPing.sln -c Release

      - name: Publish self-contained App
        run: >-
          dotnet publish src/CodexSlotPing.App/CodexSlotPing.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/stage

      - name: Publish self-contained Runner
        run: >-
          dotnet publish src/CodexSlotPing.Runner/CodexSlotPing.Runner.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          -o artifacts/stage/Runner

      - name: Verify portable layout and create ZIP/checksum
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $propsPath = Join-Path $env:GITHUB_WORKSPACE 'Directory.Build.props'
          [xml]$props = Get-Content -LiteralPath $propsPath -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid product version in Directory.Build.props: $version"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $($env:GITHUB_REF_NAME) does not match product version v$version."
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE 'artifacts/stage'
          $required = @(
            'CodexSlotPing.App.exe',
            'Runner/CodexSlotPing.Runner.exe',
            'coreclr.dll',
            'hostfxr.dll',
            'hostpolicy.dll',
            'Runner/coreclr.dll',
            'Runner/hostfxr.dll',
            'Runner/hostpolicy.dll'
          )
          foreach ($relative in $required) {
            $path = Join-Path $stage $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Portable package is missing required file: $relative"
            }
          }

          $executables = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter '*.exe' | ForEach-Object {
            [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
          } | Sort-Object)
          $expectedExecutables = @('CodexSlotPing.App.exe', 'Runner/CodexSlotPing.Runner.exe') | Sort-Object
          $missingExecutables = @($expectedExecutables | Where-Object { $_ -notin $executables })
          if ($missingExecutables.Count -gt 0) {
            throw "Portable package is missing product executables: $($missingExecutables -join ', ')"
          }
          $unexpectedExecutables = @($executables | Where-Object {
            $_ -notin $expectedExecutables -and [IO.Path]::GetFileName($_) -ne 'createdump.exe'
          })
          if ($unexpectedExecutables.Count -gt 0) {
            throw "Unexpected executables in portable package: $($unexpectedExecutables -join ', ')"
          }

          $pdbFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File -Filter '*.pdb')
          if ($pdbFiles.Count -gt 0) {
            throw "Portable package must not contain PDB files: $($pdbFiles.FullName -join ', ')"
          }

          $expectedFileVersion = "$version.0"
          $expectedProductVersion = "$version+$($env:GITHUB_SHA.ToLowerInvariant())"
          foreach ($relative in @('CodexSlotPing.App.exe', 'Runner/CodexSlotPing.Runner.exe')) {
            $versionInfo = (Get-Item -LiteralPath (Join-Path $stage $relative)).VersionInfo
            if ($versionInfo.FileVersion -ne $expectedFileVersion) {
              throw "$relative FileVersion was '$($versionInfo.FileVersion)', expected '$expectedFileVersion'."
            }
            if ($versionInfo.ProductVersion -ne $expectedProductVersion) {
              throw "$relative ProductVersion was '$($versionInfo.ProductVersion)', expected '$expectedProductVersion'."
            }
          }

          $scriptFiles = @(Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object {
            $_.Extension -in @('.ps1', '.psm1', '.cmd', '.bat')
          })
          if ($scriptFiles.Count -gt 0) {
            throw 'Portable package must not require a PowerShell or shell wrapper.'
          }

          $artifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $artifactName = "CodexSlotPing-v$version-win-x64"
          $zipName = "$artifactName.zip"
          $checksumName = "$zipName.sha256"
          $zipPath = Join-Path $artifactDirectory $zipName
          $checksumPath = Join-Path $artifactDirectory $checksumName
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($requiredEntry in @('CodexSlotPing.App.exe', 'Runner/CodexSlotPing.Runner.exe')) {
              if ($entries -notcontains $requiredEntry) {
                throw "ZIP is missing required executable: $requiredEntry"
              }
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($checksumPath, "$hash  $zipName`n", [Text.UTF8Encoding]::new($false))
          $verifiedHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not (Get-Content -LiteralPath $checksumPath -Raw).StartsWith($verifiedHash)) {
            throw 'The SHA-256 file does not match the ZIP.'
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "artifact-name=$artifactName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip-path=artifacts/$zipName"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "checksum-path=artifacts/$checksumName"

      - name: Upload ZIP and checksum
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: |
            ${{ steps.package.outputs.zip-path }}
            ${{ steps.package.outputs.checksum-path }}
          if-no-files-found: error
